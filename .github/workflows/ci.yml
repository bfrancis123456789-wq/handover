name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, security checks and end-to-end walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,edge-runtime

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Security checks and end-to-end walkthrough
        run: bash e2e/run-ci.sh

      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/out
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
